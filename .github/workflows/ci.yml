---
name: CI

# yamllint disable rule:truthy
on:
    pull_request:
        branches: ["main"]
    push:
        branches: ["main"]
    schedule:
        - cron: '41 5 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# yamllint disable rule:line-length
env:
    GITLEAKS_VERSION: 8.30.1
    GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
    ci:
        name: CI
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        steps:
            - name: Check out the full history
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              id: checkout
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Require a complete clone
              id: complete_clone
              run: |
                  set -euo pipefail
                  test "$(git rev-parse --is-shallow-repository)" = "false"
                  echo "commits in history: $(git rev-list --count HEAD)"

            - name: Install gitleaks
              id: install_gitleaks
              run: |
                  set -euo pipefail
                  tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl --proto "=https" --tlsv1.2 -sSfL -o "${RUNNER_TEMP}/${tarball}" \
                      "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
                  echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
                  tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gitleaks
                  "${RUNNER_TEMP}/gitleaks" version

            - name: Run gitleaks over the history of the checked-out commit
              id: gitleaks
              run: '"${RUNNER_TEMP}/gitleaks" git --no-banner --redact --verbose --log-opts="HEAD" .'

            - name: Install the Python tools
              id: install_python_tools
              if: ${{ !cancelled() }}
              run: |
                  set -euo pipefail
                  python3 -m venv "${RUNNER_TEMP}/venv"
                  "${RUNNER_TEMP}/venv/bin/pip" install --quiet --require-virtualenv -r ci/requirements.txt
                  echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"

            - name: shellcheck
              id: shellcheck
              if: ${{ !cancelled() }}
              run: |
                  set -euo pipefail
                  shellcheck --version
                  shellcheck scripts/*.sh

            - name: Syntax-check build.sh and the cloudify.sh it generates
              id: cloudify
              if: ${{ !cancelled() }}
              run: sh scripts/check_cloudify.sh

            - name: yamllint
              id: yamllint
              if: ${{ !cancelled() }}
              run: |
                  set -euo pipefail
                  yamllint --version
                  yamllint --strict .

            # shellcheck runs above and yamllint covers check-yaml; actionlint
            # skips run: blocks silently when shellcheck is missing.
            - name: pre-commit hooks
              id: pre_commit
              if: ${{ !cancelled() }}
              env:
                  SKIP: shellcheck,check-yaml
              run: |
                  set -euo pipefail
                  command -v shellcheck
                  pre-commit --version
                  pre-commit run --all-files --show-diff-on-failure

    tool-drift:
        name: Tool drift
        if: github.event_name == 'schedule'
        permissions:
            contents: read
            issues: write
        uses: cdf-eagles/.github/.github/workflows/tool-drift.yaml@4f61e172889ba89b4b32a8ebdc798d432c507ba7  # v1.0.0
