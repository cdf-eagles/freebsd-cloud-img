---
name: CI

# yamllint disable rule:truthy
on:
    pull_request:
        branches: ["main"]
    push:
        branches: ["main"]
    schedule:
        - cron: '41 5 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# yamllint disable rule:line-length
env:
    GITLEAKS_VERSION: 8.30.1
    GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    SNYK_VERSION: 1.1308.4
    SNYK_SHA256: 979172ee128903f50e43fff221f22a0689579f22c086dabaa0d1a5416485b9ba
    PYTHON_VERSION: "3.13.18"

jobs:
    ci:
        name: CI
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        steps:
            - name: Check out the full history
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              id: checkout
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Require a complete clone
              id: complete_clone
              run: |
                  set -euo pipefail
                  test "$(git rev-parse --is-shallow-repository)" = "false"
                  echo "commits in history: $(git rev-list --count HEAD)"

            - name: Install gitleaks
              id: install_gitleaks
              run: |
                  set -euo pipefail
                  tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl --proto "=https" --tlsv1.2 -sSfL -o "${RUNNER_TEMP}/${tarball}" \
                      "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
                  echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
                  tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gitleaks
                  "${RUNNER_TEMP}/gitleaks" version

            - name: Run gitleaks over the history of the checked-out commit
              id: gitleaks
              run: '"${RUNNER_TEMP}/gitleaks" git --no-banner --redact --verbose --log-opts="HEAD" .'

            # yamllint disable-line rule:line-length
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install the Python tools
              id: install_python_tools
              if: ${{ !cancelled() }}
              run: |
                  set -euo pipefail
                  python3 -m venv "${RUNNER_TEMP}/venv"
                  "${RUNNER_TEMP}/venv/bin/pip" install --quiet --require-virtualenv -r ci/requirements.txt
                  echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"

            - name: shellcheck
              id: shellcheck
              if: ${{ !cancelled() }}
              run: |
                  set -euo pipefail
                  shellcheck --version
                  shellcheck scripts/*.sh

            - name: Syntax-check build.sh and the cloudify.sh it generates
              id: cloudify
              if: ${{ !cancelled() }}
              run: sh scripts/check_cloudify.sh

            - name: yamllint
              id: yamllint
              if: ${{ !cancelled() }}
              run: |
                  set -euo pipefail
                  yamllint --version
                  yamllint --strict .

            # shellcheck runs above and yamllint covers check-yaml; actionlint
            # skips run: blocks silently when shellcheck is missing.
            - name: pre-commit hooks
              id: pre_commit
              if: ${{ !cancelled() }}
              env:
                  SKIP: shellcheck,check-yaml
              run: |
                  set -euo pipefail
                  command -v shellcheck
                  pre-commit --version
                  pre-commit run --all-files --show-diff-on-failure

    snyk:
        name: Snyk
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        steps:
            - name: Check out code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false

            # yamllint disable-line rule:line-length
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            # The Snyk CLI reads the dependency tree from the installed packages.
            - name: Install the Python tools
              run: |
                  set -euo pipefail
                  python3 -m venv "${RUNNER_TEMP}/venv"
                  "${RUNNER_TEMP}/venv/bin/pip" install --quiet --require-virtualenv -r ci/requirements.txt

            - name: Install the Snyk CLI
              run: |
                  set -euo pipefail
                  curl --proto "=https" --tlsv1.2 -sSfL -o "${RUNNER_TEMP}/snyk" \
                      "https://github.com/snyk/cli/releases/download/v${SNYK_VERSION}/snyk-linux"
                  echo "${SNYK_SHA256}  ${RUNNER_TEMP}/snyk" | sha256sum -c -
                  chmod 755 "${RUNNER_TEMP}/snyk"
                  "${RUNNER_TEMP}/snyk" --version

            # Fails on any high or critical issue in the CI tool pins, on a scan
            # error, and when ci/requirements.txt is missing, so the required
            # check fails closed. Dependabot pull requests read SNYK_TOKEN from
            # the Dependabot secrets.
            - name: Fail on high or critical dependency issues
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
                  SNYK_DISABLE_ANALYTICS: 1
              run: |
                  set -euo pipefail
                  if [ -z "${SNYK_TOKEN}" ]; then
                      echo "::error::SNYK_TOKEN is not set for this run"
                      exit 1
                  fi
                  "${RUNNER_TEMP}/snyk" test --file=ci/requirements.txt --package-manager=pip \
                      --command="${RUNNER_TEMP}/venv/bin/python" --severity-threshold=high

    tool-drift:
        name: Tool drift
        if: github.event_name == 'schedule'
        permissions:
            contents: read
            issues: write
        uses: cdf-eagles/.github/.github/workflows/tool-drift.yaml@a3ceea039aa09885488009ee39ac07d9e7cfdefe  # v1.1.1
