---
name: Check YAML

# yamllint disable rule:truthy
on:
    push:
        paths:
            - '**.yml'
            - '**.yaml'
    pull_request:
        types:
            - opened
            - edited
            - reopened
        paths:
            - '**.yml'
            - '**.yaml'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        name: Execute Check YAML
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              id: checkout

            - name: yaml-lint
              # yamllint disable rule:line-length
              uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c
              id: yamllint
