---
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      commit-message:
          prefix: ci
          include: scope
      groups:
          github-actions:
              patterns:
                  - '*'
    - package-ecosystem: pip
      directory: /ci
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      commit-message:
          prefix: ci
          include: scope
      groups:
          python-tools:
              patterns:
                  - '*'
    - package-ecosystem: pre-commit
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      commit-message:
          prefix: ci
          include: scope
      groups:
          pre-commit-hooks:
              patterns:
                  - '*'
